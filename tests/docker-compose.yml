services:
  # SQL Server for the database suite (orcha/tests/db). Only the
  # MSSQL-specific tests use it; they self-skip when the ORCHA_MSSQL_* env vars
  # are unset, so this service is optional for the core suite.
  orcha-tests-mssql:
    container_name: orcha-tests-mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Orcha_test_pass1"
      MSSQL_PID: "Developer"
    # sqlcmd ships in the image; use it to wait until the engine actually
    # accepts logins before tests connect. -C trusts the self-signed cert.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  orcha-tests-db:
    container_name: orcha-tests-db
    image: postgres:16-bookworm
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_USER: orcha_user
      POSTGRES_PASSWORD: orcha_pass
      POSTGRES_DB: orcha
    # Wait until Postgres is actually accepting connections before the test
    # containers start, so the session initialise() doesn't race the DB.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcha_user -d orcha"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Core suite: runs against a fully initialised database.
  orcha-tests:
    container_name: orcha-tests
    build:
      # Build context is the repo root so the image can install orcha's own
      # requirements; the source itself is mounted at runtime.
      context: ../../
      dockerfile: orcha/tests/Dockerfile
    working_dir: /app
    environment:
      ORCHA_CORE_USER: orcha_user
      ORCHA_CORE_PASSWORD: orcha_pass
      ORCHA_CORE_SERVER: orcha-tests-db:5432
      ORCHA_CORE_DB: orcha
    volumes:
      - ../../:/app
    depends_on:
      orcha-tests-db:
        condition: service_healthy

  # Uninitialised suite: separate process where orcha is never initialised.
  orcha-tests-uninitialised:
    container_name: orcha-tests-uninitialised
    build:
      context: ../../
      dockerfile: orcha/tests/Dockerfile-uninitialised
    working_dir: /app
    environment:
      ORCHA_CORE_USER: orcha_user
      ORCHA_CORE_PASSWORD: orcha_pass
      ORCHA_CORE_SERVER: orcha-tests-db:5432
      ORCHA_CORE_DB: orcha
    volumes:
      - ../../:/app
    depends_on:
      orcha-tests-db:
        condition: service_healthy
