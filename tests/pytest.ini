[pytest]
# Default to the core suite. The uninitialised suite MUST run in its own process
# (it asserts the API refuses to work before initialise(), which is irreversible
# once done), so run it explicitly: `pytest uninitialised`.
testpaths = core
addopts = -v --strict-markers
# Task functions in tests are async-free plain callables; keep output readable.
console_output_style = count
